<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <!-- Keep the web portal's desktop canvas on phones too. The mobile browser
         lays out a 1280px viewport and scales the complete desktop page down,
         instead of switching to a responsive/mobile layout or horizontal panning. -->
    <meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      /* An Pardaz web is intentionally desktop-only on every device. */
      html,
      body,
      #root {
        min-width: 1280px;
        width: 1280px;
      }

      body {
        overflow-x: hidden;
      }
    </style>
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
