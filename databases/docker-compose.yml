services:
  anpardaz-db:
    image: postgres:17
    container_name: anpardaz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ANPARDAZ_DB_NAME:-anpardaz}
      POSTGRES_USER: ${ANPARDAZ_DB_USER:-anpardaz}
      POSTGRES_PASSWORD: ${ANPARDAZ_DB_PASSWORD:?Set ANPARDAZ_DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - anpardaz-db-data:/var/lib/postgresql/data

  ansarraf-db:
    image: postgres:17
    container_name: ansarraf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ANSARRAF_DB_NAME:-ansarraf}
      POSTGRES_USER: ${ANSARRAF_DB_USER:-ansarraf}
      POSTGRES_PASSWORD: ${ANSARRAF_DB_PASSWORD:?Set ANSARRAF_DB_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ansarraf-db-data:/var/lib/postgresql/data

  platform-db:
    image: postgres:17
    container_name: platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform}
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - platform-db-data:/var/lib/postgresql/data

volumes:
  anpardaz-db-data:
  ansarraf-db-data:
  platform-db-data:
